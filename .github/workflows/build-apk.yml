name: Build Songjog APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk Songjog-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Songjog-debug-apk
          path: Songjog-debug.apk

      - name: Publish Direct APK to GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: সংযোগ (Songjog) — Latest APK
          body: সরাসরি ফোনে ইনস্টল করতে নিচের Songjog-debug.apk ফাইলে ট্যাপ করুন।
          files: Songjog-debug.apk
